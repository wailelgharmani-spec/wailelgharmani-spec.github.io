<html>
    <head></head>
    <h1>General Admission Registration</h1>
    <table><form>
         <tr>
            <td><label for="Name">Name</label> 
             <input type="text" placeholder="First name" name="Name">
             <input type="text" placeholder="Last name" name="Name">
             <br>
             <br>
             <label for="Email">Email</label>    
             <input type="email" placeholder="sample@example.com" name="Email">
             <br>
             <br>
             <label for="Gender">Gender</label>
             <input type="radio" name="Gender">Male
             <input type="radio" name="Gender">Female
             <br>
             <br>
             <label for="Phone">Phone</label>
             <input type="tel" name="Phone">
             <br>
             <br>
             <label for="Emergency Contact">Emergency Contact</label>
             <input type="tel" name="Emergency Contact">
             <br>
             <br>
             <label for="Parking">Do you requiere parking?</label>
             <input type="radio" name="Parking">Yes
             <input type="radio" name="Parking">No
             <br>
             <br>
             <label for="Room">What is your room preference?</label>
             <br>
             <input type="radio" name="Room">Single Room
             <br>
             <input type="radio" name="Room">Shared Room
             <br>
             <input type="radio" name="Room">No Room Needed
            </td>
             <td>
                <label for="Diet">Do you have dietary restrictions?</label>
                <br>
                <input type="checkbox" name="Diet">None
                <br>
                <input type="checkbox" name="Diet">Vegetarian
                <br>
                <input type="checkbox" name="Diet">Gluten Allergy
                <br>
                <input type="checkbox" name="Diet">Lactose Allergy
                <br>
                <input type="checkbox" name="Diet">Nut Allergy
                <br>
                <input type="checkbox" name="Diet">Shellfish Allergy
                <br>
                <br>
                <label for="Activities"></label>What activities will you attend?
                <br>
                <input type="checkbox" name="Activities">Awards Gala Dinner
                <br>
                <input type="checkbox" name="Activities">Luncheon
                <br>
                <input type="checkbox" name="Activities">Town Hal
                <br>
                <br>
                <label for="Profiles">Do you want to see the list of other attendees and their profiles on the official event app?</label>
                <br>
                <input type="radio" name="Profiles">Yes
                <input type="radio"name="Profiles" >No
             </td>
         </tr>

    </table></form>
</html>
